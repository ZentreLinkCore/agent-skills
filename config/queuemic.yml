# Per-project settings for the /webkit-* skills — QueueMic.
# Versioning procedure: .agents/rules/conditional/versioning.md

versioning:
  mode: auto                 # auto | recommend | off

  targets:
    - name: mobapp
      repo: mobapp           # its own git repo
      paths: [mobapp/]
      ignore_paths:
        - mobapp/android/    # gitignored; regenerated by `expo prebuild` from app.json
        - mobapp/ios/        # gitignored; regenerated by `expo prebuild` from app.json
        - mobapp/dist/       # build output
        - mobapp/node_modules/
      version:
        - { file: mobapp/app.json, key: expo.version }
        - { file: mobapp/package.json, key: version }
      build_numbers:
        # eas.json uses appVersionSource "local", so app.json is the source of the build numbers.
        # Both keys are absent today; builds have been using 1 (android/app/build.gradle: versionCode 1).
        - { file: mobapp/app.json, key: expo.android.versionCode, type: integer, create_if_missing: true, initial: 1 }
        - { file: mobapp/app.json, key: expo.ios.buildNumber, type: string, create_if_missing: true, initial: "1" }
      changelog: mobapp/CHANGELOG.md
      warnings:
        - >-
          app.json sets runtimeVersion.policy "appVersion": the new version is a new runtime. Ship it as a new
          native build (eas build). OTA updates published for this version do not reach installs of the old one.
      after_release:
        - >-
          Once the build is live in the stores, set APP_LATEST_VERSION=<new version> on the backend
          (backend/config/app_version.php) so older installs see the optional update prompt.
        - >-
          Raise APP_MIN_SUPPORTED_VERSION only for a MAJOR (breaking) release: clients below it get HTTP 426 and
          cannot use the app until they update.

    # backend/ (Laravel API) carries no app version: composer.json has no "version" key, so a backend-only
    # ticket bumps nothing. Add a target here if the API starts versioning its releases.
